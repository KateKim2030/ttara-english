<body>
<title>따라말하기 영어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Jua&family=IBM+Plex+Sans+KR:wght@500&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* One look on purpose: a printed sticker book. Tilted comic stage on top, words in the middle, chunky keys in thumb reach. */
:root {
  --paper: #ece6dc; --dots: rgba(23, 19, 15, .13); --ink: #17130f; --soft: #5d5346; --dim: #aba192;
  --white: #fffdf7; --yellow: #ffce3a; --pink: #ff5c8a; --pine: #1e6a4c;
  --en: "Bricolage Grotesque", "Segoe UI", Roboto, sans-serif;
  --fun: "Jua", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --ko: "IBM Plex Sans KR", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; } /* .view and .script set display, which would otherwise beat the hidden attribute. */
html, body { height: 100%; }
body {
  color: var(--ink); font-family: var(--ko); transition: background-color .25s;
  background-color: var(--paper);
  background-image: radial-gradient(var(--dots) 1.3px, transparent 1.6px);
  background-size: 20px 20px;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }

.app {
  height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
  padding-block: 10px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mode, .cat, .ctl, .opt {
  border: 3px solid var(--ink); background: var(--white); font-family: var(--fun);
  box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s;
}
.mode:active, .cat:active, .ctl:active, .opt:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.mode { min-height: 44px; border-radius: 12px; font-size: 18px; }
.mode[aria-pressed="true"] { background: var(--ink); color: var(--white); }
.view { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
/* More topics than fit on a phone: the row slides sideways, and the cut-off last button hints at it. */
.cats { flex: none; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 0 3px 3px 0; overscroll-behavior-x: contain; }
.cats::-webkit-scrollbar { display: none; }
.cat { flex: 1 0 auto; min-width: 54px; min-height: 38px; padding: 0 10px; border-width: 2px; border-radius: 10px; box-shadow: 2px 2px 0 var(--ink); font-size: 15px; white-space: nowrap; }
.cat[aria-pressed="true"] { background: var(--yellow); }

.stage { position: relative; flex: none; align-self: center; width: min(calc(100% - 10px), 54dvh); aspect-ratio: 400 / 190; margin: 6px 6px 16px 4px; transform: rotate(-1.3deg); transition: width .3s; }
.stage.compact { align-self: flex-start; width: min(46%, 26dvh); margin-bottom: 4px; }
.stage.compact .count, .stage.compact .tag, .stage.compact .sticker { display: none; }
.art { position: absolute; inset: 0; overflow: hidden; border: 4px solid var(--ink); border-radius: 18px; box-shadow: 7px 7px 0 var(--ink); background: var(--white); }
.art svg { display: block; width: 100%; height: 100%; }
.sticker {
  position: absolute; top: -9px; left: -3px; padding: 4px 11px; border: 3px solid var(--ink); border-radius: 9px;
  background: var(--pink); font-family: var(--fun); font-size: 17px; transform: rotate(-4deg); box-shadow: 3px 3px 0 var(--ink);
  animation: pop .26s cubic-bezier(.3, 1.7, .5, 1);
}
.stage[data-phase="turn"] .sticker { background: var(--yellow); }
.count { position: absolute; bottom: -10px; right: 14px; padding: 3px 8px; border-radius: 6px; background: var(--ink); color: var(--white); font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.tag { position: absolute; left: 12px; bottom: -13px; padding: 3px 11px; border: 3px solid var(--ink); border-radius: 7px; background: var(--white); font-family: var(--fun); font-size: 16px; transform: rotate(1.6deg); box-shadow: 3px 3px 0 var(--ink); }

.waves path { fill: none; stroke: var(--white); stroke-width: 5; stroke-linecap: round; opacity: .25; }
.stage[data-phase="listen"] .waves path { animation: wave 1s infinite; }
.stage[data-phase="listen"] .waves path:nth-child(2) { animation-delay: .14s; }
.stage[data-phase="listen"] .waves path:nth-child(3) { animation-delay: .28s; }
.stage[data-phase="turn"] .bob { animation: bob .55s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
.flame { animation: flick .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
.twinkle { animation: tw 1.6s ease-in-out infinite alternate; }
.head { animation: slide 3.4s linear infinite; }
@keyframes wave { 0%, 100% { opacity: .25; } 45% { opacity: 1; } }
@keyframes bob { to { transform: translateY(-5px) rotate(1.5deg); } }
@keyframes flick { to { transform: scaleY(1.2) scaleX(.9); } }
@keyframes tw { to { opacity: .25; } }
@keyframes slide { from { transform: translateX(0); } to { transform: translateX(150px); } }
@keyframes pop { from { transform: rotate(-4deg) scale(.5); } }

.card { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.text { margin-block: auto; display: flex; flex-direction: column; gap: 6px; }
.en { margin: 0; font-family: var(--en); font-weight: 800; font-size: clamp(27px, 7.8vw, 40px); line-height: 1.18; letter-spacing: -.01em; overflow-wrap: anywhere; }
.w { border-radius: 6px; transition: color .08s; }
.w.todo { color: var(--dim); }
.w.cur { background: var(--yellow); box-shadow: 0 0 0 3px var(--yellow); }
.ko { margin: 0; color: var(--soft); font-size: 17px; line-height: 1.45; }
.ko.veiled { filter: blur(8px); user-select: none; }
.cue-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.cue-text { margin: 0; font-family: var(--fun); font-size: 18px; color: var(--pine); }
.cue-text.speak { color: var(--ink); }
.reps { display: flex; gap: 6px; flex: none; }
.rep { width: 15px; height: 15px; border-radius: 50%; border: 3px solid var(--ink); background: var(--white); }
.rep.on { background: var(--pink); }
.track { flex: none; height: 12px; border: 3px solid var(--ink); border-radius: 7px; background: var(--white); overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--yellow); }
.err { margin: 0; color: #a3210f; font-size: 14px; line-height: 1.45; }

.foot { flex: none; display: flex; flex-direction: column; gap: 9px; }
.play-row { display: grid; grid-template-columns: 1fr 1.7fr 1fr; gap: 9px; }
.ctl { min-height: 62px; border-radius: 15px; font-size: 19px; box-shadow: 4px 4px 0 var(--ink); }
.main { background: var(--yellow); font-size: 25px; }
.main[aria-pressed="true"] { background: var(--pink); }
.opt-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.opt { min-height: 42px; border-width: 2px; border-radius: 10px; box-shadow: 2px 2px 0 var(--ink); font-size: 15px; }
.note { margin: 0; color: var(--soft); font-size: 12px; text-align: center; }

.ltitle { margin: 0; font-family: var(--en); font-size: 23px; line-height: 1.15; }
.q { margin: 0; font-family: var(--fun); font-size: 19px; line-height: 1.4; }
.wait { margin: auto 0; text-align: center; color: var(--soft); font-size: 16px; line-height: 1.6; }
.script { display: flex; flex-direction: column; gap: 2px; }
.line { display: block; width: 100%; padding: 6px 8px; border: 0; border-radius: 9px; background: transparent; text-align: left; }
.line-en { display: block; font-family: var(--en); font-size: 19px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
.line-ko { display: block; margin-top: 2px; font-size: 14px; line-height: 1.4; color: var(--soft); }
.line.now { background: var(--yellow); }
.line.now .line-ko { color: var(--ink); }
.ans { margin: 0; color: var(--pine); font-family: var(--fun); font-size: 17px; }
/* Short screens: the sentence outranks the picture. */
@media (max-height: 680px) {
  .app, .view { gap: 7px; }
  .stage { width: min(calc(100% - 10px), 38dvh); margin-bottom: 14px; }
  .stage.compact, .note { display: none; }
  .en { font-size: clamp(23px, 6.6vw, 30px); }
  .ctl { min-height: 52px; }
  .opt { min-height: 38px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .waves path { opacity: .8; } }
</style>

<main class="app">
  <div class="modes" role="group" aria-label="연습 종류">
    <button class="mode" id="modeRepeat" type="button">따라 말하기</button>
    <button class="mode" id="modeListen" type="button">듣기</button>
  </div>

  <div class="view" id="repeatView">
    <div class="cats" id="cats" role="group" aria-label="문장 종류"></div>
    <div class="stage" id="stage" data-phase="idle">
      <div class="art" id="scene" aria-hidden="true"></div>
      <span class="sticker" id="sticker" hidden></span>
      <span class="count" id="count"></span>
      <span class="tag" id="tag"></span>
    </div>
    <section class="card">
      <div class="text">
        <p class="en" id="en" lang="en"></p>
        <p class="ko" id="ko"></p>
      </div>
      <p class="err" id="err" hidden></p>
    </section>
    <div class="cue-row">
      <p class="cue-text" id="cue" aria-live="polite"></p>
      <span class="reps" id="reps" aria-label="반복 횟수"></span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="foot">
      <div class="play-row">
        <button class="ctl" id="prev" type="button">이전</button>
        <button class="ctl main" id="play" type="button" aria-pressed="false">시작</button>
        <button class="ctl" id="next" type="button">다음</button>
      </div>
      <div class="opt-row">
        <button class="opt" id="rate" type="button"></button>
        <button class="opt" id="veil" type="button"></button>
      </div>
    </div>
  </div>

  <div class="view" id="listenView" hidden>
    <div class="cats" id="lcats" role="group" aria-label="듣기 종류"></div>
    <div class="stage" id="lstage" data-phase="idle">
      <div class="art" id="lscene" aria-hidden="true"></div>
      <span class="sticker" id="lsticker" hidden></span>
      <span class="count" id="lcount"></span>
      <span class="tag" id="lkind"></span>
    </div>
    <section class="card">
      <h1 class="ltitle" id="ltitle" lang="en" hidden></h1>
      <p class="q" id="lq"></p>
      <p class="wait" id="lwait">글자를 보지 말고 들어 보세요.<br>끝나면 글과 뜻이 나와요.</p>
      <div class="script" id="lscript" hidden></div>
      <p class="ans" id="lans" hidden></p>
      <p class="err" id="lerr" hidden></p>
    </section>
    <p class="cue-text" id="lcue" aria-live="polite"></p>
    <div class="foot">
      <div class="play-row">
        <button class="ctl" id="lprev" type="button">이전</button>
        <button class="ctl main" id="lplay" type="button" aria-pressed="false">시작</button>
        <button class="ctl" id="lnext" type="button">다음</button>
      </div>
      <div class="opt-row">
        <button class="opt" id="lrate" type="button"></button>
        <button class="opt" id="lshow" type="button"></button>
      </div>
      <p class="note">듣기 글은 이 앱을 위해 새로 썼어요. 뉴스는 가상 내용이에요.</p>
    </div>
  </div>
</main>

function putScene(el, key) {
  if (el.dataset.key === key) return;
  el.dataset.key = key;
  el.innerHTML = SCENES[key].art();
}
function paintRepeat() {
  const key = REPEAT_SCENE[current().cat];
  putScene($("scene"), key);
  $("tag").textContent = current().cat + " 표현";
  if (state.mode === "repeat") document.documentElement.style.setProperty("--paper", SCENES[key].paper);
}
function paintListen() {
  const key = LISTEN_SCENE[currentListen().cat];
  putScene($("lscene"), key);
  $("lstage").classList.toggle("compact", revealed);
  if (state.mode === "listen") document.documentElement.style.setProperty("--paper", SCENES[key].paper);
}
function setStage(phase) {
  for (const [stage, sticker] of [["stage", "sticker"], ["lstage", "lsticker"]]) {
    $(stage).dataset.phase = phase;
    $(sticker).hidden = phase === "idle";
    $(sticker).textContent = STICKER[phase] || "";
  }
}

let wordSpans = [];
function paintWords(text) {
  let pos = 0;
  const box = $("en");
  box.replaceChildren();
  wordSpans = text.split(" ").map((w) => {
    const s = document.createElement("span");
    s.className = "w";
    s.textContent = w + " ";
    s.dataset.start = pos;
    pos += w.length + 1;
    box.appendChild(s);
    return s;
  });
}
function markChar(ci) {
  let cur = 0;
  wordSpans.forEach((s, i) => { if (+s.dataset.start <= ci) cur = i; });
  wordSpans.forEach((s, i) => { s.className = "w " + (i < cur ? "past" : i === cur ? "cur" : "todo"); });
}
function clearWords() { wordSpans.forEach((s) => { s.className = "w"; }); }
// Many Android voices never report word positions, so a timed sweep drives the highlight until one arrives.
async function sweep(len, ms, id, over) {
  const t0 = performance.now();
  while (live(id) && !over()) {
    const p = (performance.now() - t0) / ms;
    if (p < 1) markChar(p * len);
    await sleep(50, id);
  }
}


let state = { cat: "전체", index: 0, slow: true, veiled: false, mode: "repeat", lCat: "전체", lIndex: 0 };
try { state = { ...state, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; } catch (e) {}
if (!CATS.includes(state.cat)) state.cat = "전체";
// New material sits at the front; send everyone back to item 1 once when it arrives.
const CONTENT = 2;
if (state.content !== CONTENT) { state.index = 0; state.lIndex = 0; state.content = CONTENT; }

let run = 0;
let running = false;
let wake = null;
let englishVoice = null;
const synth = window.speechSynthesis || null;

function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function list() { return state.cat === "전체" ? SENTENCES : SENTENCES.filter((s) => s.cat === state.cat); }
function current() { const l = list(); state.index = ((state.index % l.length) + l.length) % l.length; return l[state.index]; }
function rate() { return state.slow ? 0.82 : 1; }
function live(id) { return id === run; }

function pickVoice() {
  if (!synth) return;
  const voices = synth.getVoices().filter((v) => /^en[-_]US/i.test(v.lang));
  englishVoice = voices.find((v) => /google/i.test(v.name)) || voices[0] || null;
}
if (synth) { pickVoice(); synth.addEventListener?.("voiceschanged", pickVoice); }

function setCue(text, speaking) {
  const c = $("cue");
  c.textContent = text;
  c.classList.toggle("speak", !!speaking);
}
function setReps(done) {
  [...$("reps").children].forEach((d, i) => d.classList.toggle("on", i < done));
}
function setFill(pct) { $("fill").style.width = pct + "%"; }
function showError(msg) { const e = $("err"); e.textContent = msg; e.hidden = !msg; }

function render() {
  const s = current(), l = list();
  paintWords(s.en);
  $("ko").textContent = s.ko;
  $("ko").classList.toggle("veiled", state.veiled);
  $("count").textContent = (state.index + 1) + " / " + l.length;
  $("rate").textContent = state.slow ? "속도: 천천히" : "속도: 보통";
  $("veil").textContent = state.veiled ? "뜻 보기" : "뜻 가리기";
  [...$("cats").children].forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.cat === state.cat)));
  $("cats").querySelector?.('[aria-pressed="true"]')?.scrollIntoView?.({ block: "nearest", inline: "nearest" });
  const p = $("play");
  p.textContent = running ? "멈춤" : "시작";
  p.setAttribute("aria-pressed", String(running));
  paintRepeat();
  save();
}

function sleep(ms, id) {
  return new Promise((resolve) => {
    const end = performance.now() + ms;
    const tick = () => (!live(id) || performance.now() >= end) ? resolve() : setTimeout(tick, 40);
    tick();
  });
}

function estimate(text) { return (text.split(/\s+/).length * 380 + 500) / rate(); }

function speak(text, id, opts = {}) {
  return new Promise((resolve) => {
    const guess = estimate(text);
    let started = 0, finished = false;
    const finish = (ms) => { if (!finished) { finished = true; clearTimeout(guard); resolve(ms); } };
    // Some Android speech engines never report the end of an utterance.
    const guard = setTimeout(() => finish(guess), guess * 2.5 + 4000);
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = rate();
    const chosen = opts.voice || englishVoice;
    if (chosen) u.voice = chosen;
    if (opts.pitch) u.pitch = opts.pitch;
    u.onstart = () => { started = performance.now(); opts.onStart?.(); };
    u.onboundary = (ev) => { if (ev.name === undefined || ev.name === "word") opts.onChar?.(ev.charIndex); };
    u.onend = () => {
      const measured = started ? performance.now() - started : 0;
      finish(measured > 300 ? measured : guess);
    };
    u.onerror = (ev) => {
      if (live(id) && ev.error !== "canceled" && ev.error !== "interrupted") {
        showError("영어 음성을 재생하지 못했어요. 휴대폰 설정의 음성 출력(TTS)에서 Google 엔진과 영어 음성이 켜져 있는지 확인해 주세요.");
        stop();
      }
      finish(0);
    };
    synth.resume();
    synth.speak(u);
  });
}

async function countdown(ms, id) {
  const start = performance.now();
  while (live(id)) {
    const p = (performance.now() - start) / ms;
    if (p >= 1) break;
    setFill((1 - p) * 100);
    await sleep(40, id);
  }
  setFill(0);
}

async function play() {
  if (!synth) { showError("이 브라우저는 음성 읽기를 지원하지 않아요. 휴대폰의 Chrome에서 열어 주세요."); return; }
  showError("");
  const id = ++run;
  running = true;
  render();
  try { wake = await navigator.wakeLock?.request("screen"); } catch (e) { wake = null; }
  await sleep(150, id);
  while (live(id)) {
    const s = current();
    let known = 0;
    for (let r = 0; r < REPEATS && live(id); r++) {
      setReps(r);
      setFill(100);
      setCue("잘 들어 보세요", false);
      setStage("listen");
      let heard = false, over = false;
      const span = known || estimate(s.en);
      const spoken = await speak(s.en, id, {
        onChar: (c) => { heard = true; markChar(c); },
        onStart: () => sweep(s.en.length, span, id, () => over || heard),
      });
      over = true;
      known = spoken || known;
      clearWords();
      if (!live(id)) return;
      setCue("이제 따라 말해 보세요", true);
      setStage("turn");
      await countdown(Math.max(1600, spoken * 1.25 + 600), id);
      if (!live(id)) return;
      setReps(r + 1);
    }
    await sleep(350, id);
    if (!live(id)) return;
    state.index += 1;
    setReps(0);
    render();
  }
}

function stop() {
  run++;
  running = false;
  if (synth) synth.cancel();
  try { wake?.release(); } catch (e) {}
  nowLine = -1;
  setListenCue(LISTEN_IDLE);
  setStage("idle");
  clearWords();
  renderListen();
  wake = null;
  setFill(0);
  setCue("시작을 누르면 3번씩 들려 드려요", false);
  render();
}

function move(delta) {
  const was = running;
  stop();
  state.index += delta;
  setReps(0);
  render();
  if (was) play();
}

    ["A", "What about the ending?", "엔딩은 어땠어?"],
    ["B", "It felt a little long.", "조금 길게 느껴졌어."],
    ["A", "Should I cut it?", "잘라야 할까?"],
    ["B", "Yes, maybe by thirty seconds.", "응, 30초 정도."],
  ] },
  { cat: "대화", title: "Making Weekend Plans", q: "두 사람은 몇 시에 만나나요?", a: "오후 2시", lines: [
    ["A", "Are you free on Saturday?", "토요일에 시간 있어?"],
    ["B", "Not in the morning, but the afternoon is fine.", "오전은 안 되는데 오후는 괜찮아."],
    ["A", "Do you want to go hiking?", "등산 갈래?"],
    ["B", "Sure. Where should we meet?", "좋아. 어디서 만날까?"],
    ["A", "Let's meet at the station at two.", "2시에 역에서 만나자."],
    ["B", "Perfect. See you then.", "좋아. 그때 봐."],
  ] },
];
const LCATS = ["전체", "여행", "이야기", "장비", "뉴스", "연설", "대화"];
const LISTEN_IDLE = "시작을 누르면 글자 없이 2번 들려 드려요";
if (!LCATS.includes(state.lCat)) state.lCat = "전체";
let revealed = false;
var nowLine = -1;

function listenItems() { return state.lCat === "전체" ? LISTENS : LISTENS.filter((x) => x.cat === state.lCat); }
function currentListen() { const l = listenItems(); state.lIndex = ((state.lIndex % l.length) + l.length) % l.length; return l[state.lIndex]; }
function setListenCue(text) { $("lcue").textContent = text; }
function markLine(i) {
  nowLine = i;
  [...$("lscript").children].forEach((el, k) => {
    el.classList.toggle("now", k === i);
    if (k === i) el.scrollIntoView?.({ block: "nearest", behavior: "smooth" });
  });
}
function voiceFor(who) {
  if (who === "A") return { pitch: 0.92 };
  if (who !== "B") return {};
  const other = synth ? synth.getVoices().find((v) => /^en[-_]US/i.test(v.lang) && v !== englishVoice) : null;
  return { pitch: 1.18, voice: other || undefined };
}
function renderListen() {
  const s = currentListen();
  $("lkind").textContent = s.cat;
  $("lcount").textContent = (state.lIndex + 1) + " / " + listenItems().length;
  $("lq").textContent = s.q;
  $("ltitle").textContent = s.title;
  $("ltitle").hidden = !revealed;
  $("lwait").hidden = revealed;
  $("lscript").hidden = !revealed;
  $("lans").hidden = !revealed;
  $("lans").textContent = "답: " + s.a;
  const box = $("lscript");
  box.replaceChildren();
  s.lines.forEach(([who, en, ko], i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "line" + (i === nowLine ? " now" : "");
    const eng = document.createElement("span");
    eng.className = "line-en"; eng.lang = "en"; eng.textContent = (who ? who + ": " : "") + en;
    const kor = document.createElement("span");
    kor.className = "line-ko"; kor.textContent = ko;
    b.append(eng, kor);
    b.addEventListener("click", () => sayLine(i));
    box.appendChild(b);
  });
  [...$("lcats").children].forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.cat === state.lCat)));
  $("lcats").querySelector?.('[aria-pressed="true"]')?.scrollIntoView?.({ block: "nearest", inline: "nearest" });
  $("lplay").textContent = running ? "멈춤" : "시작";
  $("lplay").setAttribute("aria-pressed", String(running));
  $("lrate").textContent = state.slow ? "속도: 천천히" : "속도: 보통";
  $("lshow").textContent = revealed ? "글자 숨기기" : "글자 보기";
  $("repeatView").hidden = state.mode !== "repeat";
  $("listenView").hidden = state.mode !== "listen";
  $("modeRepeat").setAttribute("aria-pressed", String(state.mode === "repeat"));
  $("modeListen").setAttribute("aria-pressed", String(state.mode === "listen"));
  paintListen();
  save();
}
async function speakAll(item, id, show) {
  for (let i = 0; i < item.lines.length && live(id); i++) {
    if (show) markLine(i);
    await speak(item.lines[i][1], id, voiceFor(item.lines[i][0]));
    if (!live(id)) return;
    await sleep(280, id);
  }
  if (live(id)) markLine(-1);
}
async function playListen() {
  if (!synth) { $("lerr").textContent = "이 브라우저는 음성 읽기를 지원하지 않아요. 휴대폰의 Chrome에서 열어 주세요."; $("lerr").hidden = false; return; }
  $("lerr").hidden = true;
  const id = ++run;
  running = true;
  revealed = false;
  nowLine = -1;
  renderListen();
  try { wake = await navigator.wakeLock?.request("screen"); } catch (e) { wake = null; }
  await sleep(150, id);
  const item = currentListen();
  for (let round = 1; round <= 2 && live(id); round++) {
    setListenCue("글자 없이 듣기 " + round + " / 2");
    setStage("listen");
    await speakAll(item, id, false);
    if (!live(id)) return;
    await sleep(1200, id);
  }
  if (!live(id)) return;
  revealed = true;
  renderListen();
  setListenCue("글을 보며 듣기");
  setStage("listen");
  await speakAll(item, id, true);
  if (!live(id)) return;
  stop();
  setListenCue("문장을 누르면 다시 들을 수 있어요");
}
async function sayLine(i) {
  stop();
  const id = ++run;
  const line = currentListen().lines[i];
  markLine(i);
  await sleep(150, id);
  if (!live(id)) return;
  await speak(line[1], id, voiceFor(line[0]));
  if (live(id)) markLine(-1);
}
function moveListen(delta) {
  stop();
  state.lIndex += delta;
  revealed = false;
  renderListen();
}
function setMode(mode) { stop(); state.mode = mode; render(); renderListen(); }

LCATS.forEach((cat) => {
  const b = document.createElement("button");
  b.className = "cat"; b.type = "button"; b.textContent = cat; b.dataset.cat = cat;
  b.addEventListener("click", () => { stop(); state.lCat = cat; state.lIndex = 0; revealed = false; renderListen(); });
  $("lcats").appendChild(b);
});
$("modeRepeat").addEventListener("click", () => setMode("repeat"));
$("modeListen").addEventListener("click", () => setMode("listen"));
$("lplay").addEventListener("click", () => running ? stop() : playListen());
$("lprev").addEventListener("click", () => moveListen(-1));
$("lnext").addEventListener("click", () => moveListen(1));
$("lrate").addEventListener("click", () => { state.slow = !state.slow; render(); renderListen(); });
$("lshow").addEventListener("click", () => { revealed = !revealed; nowLine = -1; renderListen(); });
setListenCue(LISTEN_IDLE);
renderListen();

document.addEventListener("visibilitychange", () => { if (document.hidden && running) stop(); });

setCue("시작을 누르면 3번씩 들려 드려요", false);
render();
</script>
</body>
</html>
